name: 👁️ Percy Visual Regression (Weekly)

on:
  # 1. Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev

  # 2. Scheduled trigger (Every Monday at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 1'

jobs:
  visual-regression:
    name: 🧪 Run Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 👁️ Execute Percy Visual Tests
        run: npm run test:visual:ci
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: https://www.opentext.com
          CI: true

      - name: 📊 Upload AI Debug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-debug-report
          path: ai-debug-report/
          retention-days: 7
