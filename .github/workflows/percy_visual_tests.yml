name: 👁️ Percy Visual Regression (Weekly)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - qa
          - dev
      viewports:
        description: 'Resolutions to capture'
        required: true
        default: '1920'
        type: choice
        options:
          - '1920'              # Large Desktop Only (Fastest)
          - '375,768,1280,1920' # Full Suite (Mobile, Tablet, Laptop, Desktop)
          - '1280,1920'         # Desktop/Laptop Only
          - '375'               # Mobile Only (Portrait)
      execution_profile:
        description: 'Execution profile (medium recommended)'
        required: true
        default: 'medium'
        type: choice
        options:
          - 'fast'
          - 'medium'
          - 'full'
      project_target:
        description: 'Device/browser target'
        required: true
        default: 'desktop-chrome'
        type: choice
        options:
          - 'desktop-chrome'
          - 'desktop-edge'
          - 'desktop-firefox'
          - 'desktop-safari'
          - 'mobile-chrome'
          - 'mobile-safari'
          - 'tablet-chrome'
          - 'tablet-safari'
          - 'responsive-matrix'
          - 'cross-browser'
          - 'all-visual'
      test_scope:
        description: 'Which visual scope to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - 'smoke'
          - 'regression'
          - 'responsive'
          - 'all'
      worker_count:
        description: 'Playwright workers (auto uses profile defaults)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '2'
          - '3'
          - '4'
          - '5'
      max_minutes:
        description: 'Execution timeout in minutes'
        required: true
        default: '45'
        type: choice
        options:
          - '30'
          - '45'
          - '60'

  schedule:
    # Weekly run (Monday 02:00 UTC) with full visual matrix.
    - cron: '0 2 * * 1'

jobs:
  visual-regression:
    name: 🧪 Run Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.max_minutes || '45') }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧰 Ensure Report Directories Exist
        if: always()
        run: |
          mkdir -p ai-debug-report
          mkdir -p playwright-report
          mkdir -p test-results
          mkdir -p log

      - name: 🧩 Generate Percy Config from Input Widths
        run: |
          cat > configs/percy.yml <<EOF
          version: 2
          snapshot:
            widths: [${{ github.event.inputs.viewports || '1920' }}]
            minHeight: 1024
            percy-css: |
              iframe { display: none !important; }
              #onetrust-banner-sdk, .cookie-banner, [id*='cookie'] { display: none !important; }
              [id*='ot-agent'], [class*='ot-agent'], [data-testid*='agent'] { display: none !important; }
              [id*='chat-widget'], [class*='chat-widget'], [aria-label*='chat' i], [aria-label*='assistant' i] { display: none !important; }
              [id*='summit'], [class*='summit'], [id*='region-selector'], [class*='region-selector'] { display: none !important; }
          EOF

      - name: 🔍 List Visual Tests (Dry Run)
        run: |
          PROFILE="${{ github.event.inputs.execution_profile || 'fast' }}"
          TARGET="${{ github.event.inputs.project_target || 'desktop-chrome' }}"
          SCOPE="${{ github.event.inputs.test_scope || 'smoke' }}"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${PROFILE}" = "full" ]; then
            TARGET="all-visual"
            SCOPE="all"
          fi

          if [ "${SCOPE}" = "responsive" ] && [ "${TARGET}" = "desktop-chrome" ]; then
            TARGET="responsive-matrix"
          fi

          case "${TARGET}" in
            "responsive-matrix")
              PROJECT_FLAGS="--project=viewport-xl --project=viewport-lg --project=viewport-md --project=viewport-sm --project=viewport-xs"
              ;;
            "cross-browser")
              PROJECT_FLAGS="--project=desktop-chrome --project=desktop-edge --project=desktop-firefox --project=desktop-safari"
              ;;
            "all-visual")
              PROJECT_FLAGS="--project=desktop-chrome --project=desktop-edge --project=desktop-firefox --project=desktop-safari --project=mobile-chrome --project=mobile-safari --project=tablet-chrome --project=tablet-safari --project=viewport-xl --project=viewport-lg --project=viewport-md --project=viewport-sm --project=viewport-xs"
              ;;
            *)
              PROJECT_FLAGS="--project=${TARGET}"
              ;;
          esac

          case "${SCOPE}" in
            "smoke")
              GREP_FLAGS="--grep @Smoke"
              ;;
            "regression")
              GREP_FLAGS="--grep @Regression"
              ;;
            "responsive")
              GREP_FLAGS="--grep @Responsive"
              ;;
            *)
              GREP_FLAGS=""
              ;;
          esac

          if [ "${PROFILE}" = "fast" ] && [ "${SCOPE}" = "all" ] && [ "${TARGET}" = "desktop-chrome" ]; then
            GREP_FLAGS="--grep-invert @Responsive"
            echo "Fast mode optimization applied: non-responsive pack on desktop-chrome."
          else
            echo "Listing with target=${TARGET}, scope=${SCOPE}."
          fi

          npx playwright test src/tests/visual.spec.ts --list ${PROJECT_FLAGS} ${GREP_FLAGS}

      - name: 👁️ Execute Percy Visual Tests
        run: |
          MAX_MINUTES="${{ github.event.inputs.max_minutes || '45' }}"
          WORKER_OVERRIDE="${{ github.event.inputs.worker_count || 'auto' }}"
          PROFILE="${{ github.event.inputs.execution_profile || 'fast' }}"
          TARGET="${{ github.event.inputs.project_target || 'desktop-chrome' }}"
          SCOPE="${{ github.event.inputs.test_scope || 'smoke' }}"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${PROFILE}" = "full" ]; then
            TARGET="all-visual"
            SCOPE="all"
            WORKERS=3
          else
            WORKERS=4
          fi

          if [ "${SCOPE}" = "responsive" ] && [ "${TARGET}" = "desktop-chrome" ]; then
            TARGET="responsive-matrix"
          fi

          case "${TARGET}" in
            "responsive-matrix")
              PROJECT_FLAGS="--project=viewport-xl --project=viewport-lg --project=viewport-md --project=viewport-sm --project=viewport-xs"
              ;;
            "cross-browser")
              PROJECT_FLAGS="--project=desktop-chrome --project=desktop-edge --project=desktop-firefox --project=desktop-safari"
              ;;
            "all-visual")
              PROJECT_FLAGS="--project=desktop-chrome --project=desktop-edge --project=desktop-firefox --project=desktop-safari --project=mobile-chrome --project=mobile-safari --project=tablet-chrome --project=tablet-safari --project=viewport-xl --project=viewport-lg --project=viewport-md --project=viewport-sm --project=viewport-xs"
              ;;
            *)
              PROJECT_FLAGS="--project=${TARGET}"
              ;;
          esac

          case "${SCOPE}" in
            "smoke")
              GREP_FLAGS="--grep @Smoke"
              ;;
            "regression")
              GREP_FLAGS="--grep @Regression"
              ;;
            "responsive")
              GREP_FLAGS="--grep @Responsive"
              ;;
            *)
              GREP_FLAGS=""
              ;;
          esac

          if [ "${PROFILE}" = "fast" ] && [ "${SCOPE}" = "all" ] && [ "${TARGET}" = "desktop-chrome" ]; then
            GREP_FLAGS="--grep-invert @Responsive"
            echo "Running fast Percy visual validation (optimized)."
          else
            echo "Running Percy with target=${TARGET}, scope=${SCOPE}, profile=${PROFILE}."
          fi

          if [ "${WORKER_OVERRIDE}" != "auto" ]; then
            WORKERS="${WORKER_OVERRIDE}"
          fi

          echo "Selected workers: ${WORKERS}"
          echo "Job timeout: ${MAX_MINUTES} minutes"
          npx percy exec --config configs/percy.yml -- npx playwright test src/tests/visual.spec.ts ${PROJECT_FLAGS} ${GREP_FLAGS} --workers=${WORKERS}
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: ${{ github.event.inputs.environment == 'dev' && 'https://dev.opentext.com' || github.event.inputs.environment == 'qa' && 'https://qa.opentext.com' || github.event.inputs.environment == 'staging' && 'https://staging.opentext.com' || 'https://www.opentext.com' }}
          TEST_ENV: ${{ github.event.inputs.environment || 'production' }}
          CI: true

      - name: 🎭 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
