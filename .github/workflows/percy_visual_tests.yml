name: 👁️ Percy Visual Regression (Weekly)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - qa
          - dev
      viewports:
        description: 'Resolutions to capture'
        required: true
        default: '1920'
        type: choice
        options:
          - '1920'              # Large Desktop Only (Fastest)
          - '375,768,1280,1920' # Full Suite (Mobile, Tablet, Laptop, Desktop)
          - '1280,1920'         # Desktop/Laptop Only
          - '375'               # Mobile Only (Portrait)
      auto_approve:
        description: 'Auto-approve Percy build only when recommendation is AUTO-APPROVE SAFE'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  schedule:
    - cron: '0 0 * * 1'

jobs:
  visual-regression:
    name: 🧪 Run Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧰 Ensure Report Directories Exist
        if: always()
        run: |
          mkdir -p ai-debug-report
          mkdir -p playwright-report
          mkdir -p test-results
          mkdir -p log

      - name: 🧩 Generate Percy Config from Input Widths
        run: |
          cat > configs/percy.yml <<EOF
          version: 2
          snapshot:
            widths: [${{ github.event.inputs.viewports || '1920' }}]
            minHeight: 1024
            percy-css: |
              iframe { display: none !important; }
              #onetrust-banner-sdk, .cookie-banner, [id*='cookie'] { display: none !important; }
              [id*='ot-agent'], [class*='ot-agent'], [data-testid*='agent'] { display: none !important; }
              [id*='chat-widget'], [class*='chat-widget'], [aria-label*='chat' i], [aria-label*='assistant' i] { display: none !important; }
              [id*='summit'], [class*='summit'], [id*='region-selector'], [class*='region-selector'] { display: none !important; }
          EOF

      - name: 🔍 List Visual Tests (Dry Run)
        run: |
          echo "Checking for visual tests (excluding @Responsive for speed)..."
          npx playwright test src/tests/visual.spec.ts --list --grep-invert @Responsive

      - name: 👁️ Execute Percy Visual Tests
        run: |
          npx percy exec --config configs/percy.yml -- bash -c 'echo $PERCY_BUILD_ID > percy_build_id.txt && npx playwright test src/tests/visual.spec.ts --grep-invert @Responsive --project=desktop-chrome --workers=4'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: ${{ github.event.inputs.environment == 'dev' && 'https://dev.opentext.com' || github.event.inputs.environment == 'qa' && 'https://qa.opentext.com' || github.event.inputs.environment == 'staging' && 'https://staging.opentext.com' || 'https://www.opentext.com' }}
          TEST_ENV: ${{ github.event.inputs.environment || 'production' }}
          CI: true

      - name: 🧠 Generate Percy Decision Report
        if: always()
        run: |
          node scripts/percy-review-report.cjs | tee ai-debug-report/percy-review-report.console.log
          cat ai-debug-report/percy-review-report.env >> "$GITHUB_ENV"
          cat ai-debug-report/percy-review-report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_API_TOKEN: ${{ secrets.PERCY_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: ✅ Auto-Approve Percy Build (Safe Mode)
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.auto_approve == 'true'
        run: |
          echo "Auto-approve requested. Percy recommendation: $PERCY_RECOMMENDATION"
          if [ "$PERCY_RECOMMENDATION" != "AUTO-APPROVE SAFE" ]; then
            echo "Skipping auto-approve: recommendation is not AUTO-APPROVE SAFE."
            echo "- Auto-approve: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "- Reason: recommendation is '$PERCY_RECOMMENDATION'" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$PERCY_APPROVE_LINK" ]; then
            echo "Skipping auto-approve: missing approve link."
            echo "- Auto-approve: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "- Reason: Percy approve link missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          curl -sS -X POST "$PERCY_APPROVE_LINK" \
            -H "Authorization: Token token=$PERCY_TOKEN" \
            -H "Accept: application/json"

          echo "- Auto-approve: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Approved build: $PERCY_BUILD_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_API_TOKEN: ${{ secrets.PERCY_API_TOKEN }}

      - name: 📊 Upload AI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-ai-report
          path: ai-debug-report/
          retention-days: 7
