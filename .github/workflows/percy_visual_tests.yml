name: 👁️ Percy Visual Regression (Weekly)

on:
  # 1. Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - qa
          - dev
      viewports:
        description: 'Resolutions to capture'
        required: true
        default: '375,768,1280,1920'
        type: choice
        options:
          - '375,768,1280,1920' # Full Suite (Mobile, Tablet, Laptop, Desktop)
          - '1280,1920'         # Desktop/Laptop Only
          - '375,768'           # Mobile/Tablet Only
          - '1920'              # Large Desktop Only (4K/HD)
          - '375'               # Mobile Only (Portrait)

  # 2. Scheduled trigger (Every Monday at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 1'

jobs:
  visual-regression:
    name: 🧪 Run Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧩 Generate Percy Config from Input Widths
        run: |
          cat > .percy.yml <<EOF
          version: 2
          snapshot:
            widths: [${{ github.event.inputs.viewports || '375,768,1280,1920' }}]
            minHeight: 1024
            percy-css: |
              iframe {
                display: none !important;
              }
              #onetrust-banner-sdk, .cookie-banner, [id*='cookie'] {
                display: none !important;
              }
          EOF

      - name: 🧰 Ensure Report Directories Exist
        if: always()
        run: |
          mkdir -p ai-debug-report
          mkdir -p playwright-report
          mkdir -p test-results
          mkdir -p log

      - name: 👁️ Execute Percy Visual Tests
        run: npx percy exec -- npx playwright test src/tests/visual.spec.ts --grep-invert @Responsive
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: https://www.opentext.com
          TEST_ENV: ${{ github.event.inputs.environment || 'production' }}
          CI: true

      - name: 📊 Upload AI Debug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-debug-report
          path: ai-debug-report/
          retention-days: 7
