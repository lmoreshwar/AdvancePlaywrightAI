name: 👁️ Percy Visual Regression (Weekly)

on:
  # 0. Trigger on push to make it appear in the UI
  push:
    branches: [ main, master, 'feature/*' ]

  # 1. Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev
      viewports:
        description: 'Resolutions to capture'
        required: true
        default: '375,768,1280,1920'
        type: choice
        options:
          - '375,768,1280,1920' # All
          - '1280,1920'         # Desktop Only
          - '375'               # Mobile Only
          - '768'               # Tablet Only

  # 2. Scheduled trigger (Every Monday at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 1'

jobs:
  visual-regression:
    name: 🧪 Run Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 👁️ Execute Percy Visual Tests
        run: npx percy exec --widths=${{ github.event.inputs.viewports || '375,768,1280,1920' }} -- npx playwright test src/tests/visual.spec.ts --grep-invert @Responsive
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: https://www.opentext.com
          CI: true

      - name: 📊 Upload AI Debug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-debug-report
          path: ai-debug-report/
          retention-days: 7
