name: 👁️ Percy Visual Regression (Weekly)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - qa
          - dev
      viewports:
        description: 'Resolutions to capture'
        required: true
        default: '1920'
        type: choice
        options:
          - '1920'              # Large Desktop Only (Fastest)
          - '375,768,1280,1920' # Full Suite (Mobile, Tablet, Laptop, Desktop)
          - '1280,1920'         # Desktop/Laptop Only
          - '375'               # Mobile Only (Portrait)

  schedule:
    - cron: '0 0 * * 1'

jobs:
  visual-regression:
    name: 🧪 Run Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧰 Ensure Report Directories Exist
        if: always()
        run: |
          mkdir -p ai-debug-report
          mkdir -p playwright-report
          mkdir -p test-results
          mkdir -p log

      - name: 🧩 Generate Percy Config from Input Widths
        run: |
          cat > configs/percy.yml <<EOF
          version: 2
          snapshot:
            widths: [${{ github.event.inputs.viewports || '1920' }}]
            minHeight: 1024
            percy-css: |
              iframe { display: none !important; }
              #onetrust-banner-sdk, .cookie-banner, [id*='cookie'] { display: none !important; }
          EOF

      - name: 🔍 List Visual Tests (Dry Run)
        run: |
          echo "Checking for visual tests (excluding @Responsive for speed)..."
          npx playwright test src/tests/visual.spec.ts --list --grep-invert @Responsive

      - name: 👁️ Execute Percy Visual Tests
        run: npx percy exec --config configs/percy.yml -- npx playwright test src/tests/visual.spec.ts --grep-invert @Responsive --project=desktop-chrome --workers=4
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: ${{ github.event.inputs.environment == 'dev' && 'https://dev.opentext.com' || github.event.inputs.environment == 'qa' && 'https://qa.opentext.com' || github.event.inputs.environment == 'staging' && 'https://staging.opentext.com' || 'https://www.opentext.com' }}
          TEST_ENV: ${{ github.event.inputs.environment || 'production' }}
          CI: true

      - name: 📊 Upload AI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-ai-report
          path: ai-debug-report/
          retention-days: 7
