name: 🎭 Playwright Tests on BrowserStack

on:
  # 1. Manual trigger with parameters
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - qa
          - dev
      test_suite:
        description: 'Test suite to execute'
        required: true
        default: '@Smoke'
        type: choice
        options:
          - '@Smoke'
          - '@Regression'
          - '@P0'
          - '@Header'
          - '@Homepage'
          - '@Responsive'
      project:
        description: 'Browser/Device Project'
        required: true
        default: 'desktop-chrome'
        type: choice
        options:
          - 'desktop-chrome'
          - 'all-projects'
          - 'all-desktop'
          - 'all-mobile'
          - 'mobile-chrome'
          - 'viewport-xl'
          - 'viewport-lg'
          - 'viewport-md'
          - 'viewport-sm'
          - 'viewport-xs'
          - 'tablet-chrome'

  # 2. Scheduled trigger (Every day at 02:00 UTC)
  schedule:
    - cron: '0 2 * * *'

jobs:
  test-browserstack:
    name: 🧪 Run Tests on BrowserStack
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧰 Ensure Report Directories Exist
        if: always()
        run: |
          mkdir -p ai-debug-report
          mkdir -p playwright-report
          mkdir -p test-results
          mkdir -p log

      - name: 🔍 List Matching Tests (Dry Run)
        run: |
          TAG_TO_RUN="${{ github.event.inputs.test_suite || '@Smoke' }}"
          echo "Checking for tests matching: $TAG_TO_RUN"
          npx playwright test --list --config=playwright.config.ts --grep "$TAG_TO_RUN"

      - name: 🧪 Run Tests on BrowserStack
        id: test
        run: |
          # Logic to handle batch project selections
          PROJECT_SELECTION="${{ github.event.inputs.project || 'desktop-chrome' }}"
          
          if [ "$PROJECT_SELECTION" == "all-projects" ]; then
            PROJECT_FLAG=""
          elif [ "$PROJECT_SELECTION" == "all-desktop" ]; then
            PROJECT_FLAG="--project=desktop-chrome --project=desktop-firefox --project=desktop-safari --project=desktop-edge"
          elif [ "$PROJECT_SELECTION" == "all-mobile" ]; then
            PROJECT_FLAG="--project=mobile-chrome --project=mobile-safari"
          else
            PROJECT_FLAG="--project=$PROJECT_SELECTION"
          fi

          TAG_TO_RUN="${{ github.event.inputs.test_suite || '@Smoke' }}"
          
          # Run tests using the BrowserStack SDK runner
          npm run test:bstack -- --config=playwright.config.ts --grep "$TAG_TO_RUN" $PROJECT_FLAG --workers=1
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_BUILD_NAME: "Functional - ${{ github.event.inputs.test_suite || '@Smoke' }} | Build #${{ github.run_number }}"
          BASE_URL: ${{ github.event.inputs.environment == 'dev' && 'https://dev.opentext.com' || github.event.inputs.environment == 'qa' && 'https://qa.opentext.com' || github.event.inputs.environment == 'staging' && 'https://staging.opentext.com' || 'https://www.opentext.com' }}
          TEST_ENV: ${{ github.event.inputs.environment || 'production' }}
          CI: true

      - name: 🔎 Debug Generated Files
        if: always()
        run: |
          pwd
          ls -la
          ls -la ai-debug-report || true
          ls -la playwright-report || true
          ls -la test-results || true
          ls -la log || true

      - name: 📊 Upload AI Debug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-report
          path: ai-debug-report/
          retention-days: 30

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: 📸 Upload Test Results (Screenshots, Videos, Traces)
        if: failure() || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: 🔍 Upload BrowserStack Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-logs
          path: log/
          retention-days: 14

      - name: ❌ Fail if Tests Failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::Tests failed on BrowserStack! Check the AIC Debug Report in artifacts for categorized failure analysis."
          exit 1
