name: 🎭 Playwright Tests on BrowserStack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - qa
          - dev
      execution_profile:
        description: 'Execution profile (medium recommended)'
        required: true
        default: 'medium'
        type: choice
        options:
          - 'fast'
          - 'medium'
          - 'full'
      test_scope:
        description: 'Which functional scope to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - 'smoke'
          - 'regression'
          - 'responsive'
          - 'all'
      project_target:
        description: 'Browser/device target'
        required: true
        default: 'desktop-chrome'
        type: choice
        options:
          - 'desktop-chrome'
          - 'desktop-edge'
          - 'desktop-firefox'
          - 'desktop-safari'
          - 'mobile-chrome'
          - 'mobile-safari'
          - 'tablet-chrome'
          - 'tablet-safari'
          - 'responsive-matrix'
          - 'cross-browser'
          - 'real-devices'
          - 'all'
      custom_grep:
        description: 'Optional custom grep (overrides scope), e.g. @P0|@Header'
        required: false
        default: ''
        type: string
      worker_count:
        description: 'Playwright workers (auto uses profile defaults)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      max_minutes:
        description: 'Execution timeout in minutes'
        required: true
        default: '45'
        type: choice
        options:
          - '30'
          - '45'
          - '60'
          - '90'

  schedule:
    - cron: '0 2 * * *'

jobs:
  test-browserstack:
    name: 🧪 Run Tests on BrowserStack
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.max_minutes || '45') }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧰 Ensure Report Directories Exist
        if: always()
        run: |
          mkdir -p ai-debug-report
          mkdir -p playwright-report
          mkdir -p test-results
          mkdir -p log

      - name: ⚙️ Build BrowserStack Platform Config
        run: |
          PROFILE="${{ github.event.inputs.execution_profile || 'medium' }}"
          TARGET="${{ github.event.inputs.project_target || 'desktop-chrome' }}"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${PROFILE}" = "full" ]; then
            TARGET="all"
          fi

          case "${TARGET}" in
            "desktop-edge")
              PLATFORMS=$'- os: Windows\n  osVersion: 10\n  browserName: edge\n  browserVersion: latest\n  resolution: 1920x1080'
              ;;
            "desktop-firefox")
              PLATFORMS=$'- os: Windows\n  osVersion: 10\n  browserName: firefox\n  browserVersion: latest\n  resolution: 1920x1080'
              ;;
            "desktop-safari")
              PLATFORMS=$'- os: OS X\n  osVersion: Sonoma\n  browserName: playwright-webkit\n  browserVersion: latest\n  resolution: 1920x1080'
              ;;
            "cross-browser"|"all")
              PLATFORMS=$'- os: Windows\n  osVersion: 10\n  browserName: chrome\n  browserVersion: latest\n  resolution: 1920x1080\n- os: Windows\n  osVersion: 10\n  browserName: edge\n  browserVersion: latest\n  resolution: 1920x1080\n- os: Windows\n  osVersion: 10\n  browserName: firefox\n  browserVersion: latest\n  resolution: 1920x1080\n- os: OS X\n  osVersion: Sonoma\n  browserName: playwright-webkit\n  browserVersion: latest\n  resolution: 1920x1080'
              ;;
            *)
              # For responsive/mobile/tablet targets, keep desktop Chrome platform.
              # Device behavior is still driven by Playwright tests/tags.
              PLATFORMS=$'- os: Windows\n  osVersion: 10\n  browserName: chrome\n  browserVersion: latest\n  resolution: 1920x1080'
              ;;
          esac

          cat > configs/browserstack.dynamic.yml <<EOF
          browserstackAuth:
            userName: \${BROWSERSTACK_USERNAME}
            accessKey: \${BROWSERSTACK_ACCESS_KEY}
          platforms:
          ${PLATFORMS}
          parallelsPerPlatform: 4
          browserstackLocal: false
          buildName: "OpenText Playwright Framework Build"
          projectName: "OpenText AI Tester"
          debug: true
          networkLogs: true
          consoleLogs: "errors"
          EOF

          echo "Effective BrowserStack target: ${TARGET}"
          echo "BROWSERSTACK_CONFIG_FILE=configs/browserstack.dynamic.yml" >> "$GITHUB_ENV"

      - name: 🔍 List Matching Tests (Dry Run)
        run: |
          PROFILE="${{ github.event.inputs.execution_profile || 'medium' }}"
          TARGET="${{ github.event.inputs.project_target || 'desktop-chrome' }}"
          SCOPE="${{ github.event.inputs.test_scope || 'smoke' }}"
          CUSTOM_GREP="${{ github.event.inputs.custom_grep || '' }}"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${PROFILE}" = "full" ]; then
            TARGET="all"
            SCOPE="all"
          fi

          if [ "${SCOPE}" = "responsive" ] && [ "${TARGET}" = "desktop-chrome" ]; then
            TARGET="responsive-matrix"
          fi

          case "${TARGET}" in
            "responsive-matrix")
              PROJECT_FLAGS=(--project=viewport-xl --project=viewport-lg --project=viewport-md --project=viewport-sm --project=viewport-xs)
              ;;
            "cross-browser")
              PROJECT_FLAGS=(--project=desktop-chrome --project=desktop-edge --project=desktop-firefox --project=desktop-safari)
              ;;
            "real-devices")
              PROJECT_FLAGS=(--project=mobile-chrome --project=mobile-safari --project=tablet-chrome --project=tablet-safari)
              ;;
            "all")
              PROJECT_FLAGS=(--project=desktop-chrome --project=desktop-edge --project=desktop-firefox --project=desktop-safari --project=viewport-xl --project=viewport-lg --project=viewport-md --project=viewport-sm --project=viewport-xs --project=mobile-chrome --project=mobile-safari --project=tablet-chrome --project=tablet-safari)
              ;;
            *)
              PROJECT_FLAGS=(--project="${TARGET}")
              ;;
          esac

          if [ -n "${CUSTOM_GREP}" ]; then
            GREP_FLAGS=(--grep "${CUSTOM_GREP}")
          else
            case "${SCOPE}" in
              "smoke")
                GREP_FLAGS=(--grep "@Smoke")
                ;;
              "regression")
                GREP_FLAGS=(--grep "@Regression|@P0")
                ;;
              "responsive")
                GREP_FLAGS=(--grep "@Responsive")
                ;;
              *)
                GREP_FLAGS=()
                ;;
            esac
          fi

          INVERT_FLAGS=(--grep-invert "@Visual")

          echo "Listing tests with scope=${SCOPE}, target=${TARGET}, profile=${PROFILE}"
          npx playwright test --list --config=playwright.config.ts "${PROJECT_FLAGS[@]}" "${GREP_FLAGS[@]}" "${INVERT_FLAGS[@]}"

      - name: 🧪 Run Tests on BrowserStack
        id: test
        run: |
          PROFILE="${{ github.event.inputs.execution_profile || 'medium' }}"
          TARGET="${{ github.event.inputs.project_target || 'desktop-chrome' }}"
          SCOPE="${{ github.event.inputs.test_scope || 'smoke' }}"
          CUSTOM_GREP="${{ github.event.inputs.custom_grep || '' }}"
          WORKER_OVERRIDE="${{ github.event.inputs.worker_count || 'auto' }}"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${PROFILE}" = "full" ]; then
            TARGET="all"
            SCOPE="all"
            WORKERS=4
          elif [ "${PROFILE}" = "fast" ]; then
            WORKERS=3
          else
            WORKERS=4
          fi

          if [ "${SCOPE}" = "responsive" ] && [ "${TARGET}" = "desktop-chrome" ]; then
            TARGET="responsive-matrix"
          fi

          case "${TARGET}" in
            "responsive-matrix")
              PROJECT_FLAGS=(--project=viewport-xl --project=viewport-lg --project=viewport-md --project=viewport-sm --project=viewport-xs)
              ;;
            "cross-browser")
              PROJECT_FLAGS=(--project=desktop-chrome --project=desktop-edge --project=desktop-firefox --project=desktop-safari)
              ;;
            "real-devices")
              PROJECT_FLAGS=(--project=mobile-chrome --project=mobile-safari --project=tablet-chrome --project=tablet-safari)
              ;;
            "all")
              PROJECT_FLAGS=(--project=desktop-chrome --project=desktop-edge --project=desktop-firefox --project=desktop-safari --project=viewport-xl --project=viewport-lg --project=viewport-md --project=viewport-sm --project=viewport-xs --project=mobile-chrome --project=mobile-safari --project=tablet-chrome --project=tablet-safari)
              ;;
            *)
              PROJECT_FLAGS=(--project="${TARGET}")
              ;;
          esac

          if [ -n "${CUSTOM_GREP}" ]; then
            GREP_FLAGS=(--grep "${CUSTOM_GREP}")
          else
            case "${SCOPE}" in
              "smoke")
                GREP_FLAGS=(--grep "@Smoke")
                ;;
              "regression")
                GREP_FLAGS=(--grep "@Regression|@P0")
                ;;
              "responsive")
                GREP_FLAGS=(--grep "@Responsive")
                ;;
              *)
                GREP_FLAGS=()
                ;;
            esac
          fi

          INVERT_FLAGS=(--grep-invert "@Visual")

          if [ "${WORKER_OVERRIDE}" != "auto" ]; then
            WORKERS="${WORKER_OVERRIDE}"
          fi

          echo "Running BrowserStack with target=${TARGET}, scope=${SCOPE}, profile=${PROFILE}, workers=${WORKERS}"
          npm run test:bstack -- --config=playwright.config.ts "${PROJECT_FLAGS[@]}" "${GREP_FLAGS[@]}" "${INVERT_FLAGS[@]}" --workers=${WORKERS}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_CONFIG_FILE: ${{ env.BROWSERSTACK_CONFIG_FILE || 'configs/browserstack.dynamic.yml' }}
          BROWSERSTACK_BUILD_NAME: "Functional - ${{ github.event.inputs.test_scope || 'smoke' }} | Build #${{ github.run_number }}"
          BASE_URL: ${{ github.event.inputs.environment == 'dev' && 'https://dev.opentext.com' || github.event.inputs.environment == 'qa' && 'https://qa.opentext.com' || github.event.inputs.environment == 'staging' && 'https://staging.opentext.com' || 'https://www.opentext.com' }}
          TEST_ENV: ${{ github.event.inputs.environment || 'production' }}
          DEBUG: "browserstack-sdk:*"
          CI: true

      - name: 📊 Upload AI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-ai-report
          path: ai-debug-report/
          retention-days: 30
