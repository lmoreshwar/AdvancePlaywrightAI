name: 🎭 Playwright Tests on BrowserStack

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-browserstack:
    name: 🧪 Run Tests on BrowserStack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Tests on BrowserStack
        id: test
        run: npm run test:bstack -- src/tests/header.spec.ts
        continue-on-error: true
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BASE_URL: https://www.opentext.com
          CI: true

      - name: 📊 Upload TTA Report (HTML + AIC Debug Report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tta-report
          path: tta-report/
          retention-days: 30

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: 📸 Upload Test Results (Screenshots, Videos, Traces)
        if: failure() || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: 🔍 Upload BrowserStack Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-logs
          path: log/
          retention-days: 14

      - name: ❌ Fail if Tests Failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::Tests failed on BrowserStack! Check the AIC Debug Report in artifacts for categorized failure analysis."
          exit 1
