version: 2
snapshot:
  # Global widths for all snapshots
  # widths: [375, 768, 1280, 1920]
  widths: [1920]
  minHeight: 1024
  
  # Global CSS to hide flaky elements across the site
  percy-css: |
    /* Hide iframes (like ads or trackers) */
    iframe {
      display: none !important;
    }
    /* Hide cookie banners if they appear intermittently */
    #onetrust-banner-sdk, .cookie-banner, [id*='cookie'] {
      display: none !important;
    }

discovery:
  # Increase allowed concurrency for faster cloud rendering
  concurrency: 10
  allowed-hosts:
    - '*.opentext.com'
    - '*.fonts.googleapis.com'
