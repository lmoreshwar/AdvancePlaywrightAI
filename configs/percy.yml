version: 2
snapshot:
  # Global widths matching framework viewport breakpoints
  # XL(1376) LG(968) MD(720) SM(576) XS(440) + Desktop(1920)
  widths: [1920, 1376, 968, 720, 576, 440]
  minHeight: 1024
  
  # Global CSS to hide flaky elements across the site
  percy-css: |
    /* Hide iframes (like ads or trackers) */
    iframe {
      display: none !important;
    }
    /* Hide cookie banners if they appear intermittently */
    #onetrust-banner-sdk, .cookie-banner, [id*='cookie'] {
      display: none !important;
    }
    /* Hide dynamic chat/marketing widgets */
    .qualified-widget, [class*="wisepops"], .ot-agent-container {
      display: none !important;
    }

discovery:
  networkIdleTimeout: 500
  disableCache: true
